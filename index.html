<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>User Listing</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="container">
  <!-- Registration Form Starts Here -->
  <div class="left-form">
    <h2>Registration</h2>
    <form id="addUserForm">
      <label>Full Name</label>
      <input type="text" id="name" required>

      <label>Email Address</label>
      <input type="email" id="email" required>

      <label>Phone Number</label>
      <input type="text" id="phone" required>

      <label>Gender</label>
      <select id="gender" required>
        <option value="">Select</option>
        <option>Male</option>
        <option>Female</option>
        <option>Other</option>
      </select>

      <button type="submit" id="buttonSubmit">Submit</button>
    </form>
  </div>
  <!-- Registration Form Ends Here -->

  <!-- User List Table Starts Here -->
  <div class="right-user-table">
    <h2>Registered Users</h2>
    <div class="table-responsive">
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Name</th>
          <th>Email</th>
          <th>Phone</th>
          <th>Gender</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="userTableBody"></tbody>
    </table>
    </div>
  </div>
  <!-- User List Table Ends Here -->
</div>
<!--Container Ends Here -->


<script>
   const userForm = document.getElementById('addUserForm');
   const tableBody = document.getElementById('userTableBody');

   const nameField = document.getElementById('name');
   const emailField = document.getElementById('email');
   const phoneField = document.getElementById('phone');
   const genderField = document.getElementById('gender');
 
   let userCount = 0;
   let editRow = null;
 
   userForm.addEventListener('submit', function (e) {
     e.preventDefault();
      
     const name = nameField.value.trim();
     const email = emailField.value.trim();
     const phone = phoneField.value.trim();
     const gender = genderField.value;
 
    //  if (!nameField || !emailField || !phoneField || !genderField) return;
 
     if (editRow) {
       // UPDATE
       editRow.children[1].innerText = name;
       editRow.children[2].innerText = email;
       editRow.children[3].innerText = phone;
       editRow.children[4].innerText = gender;
 
       buttonSubmit.innerText = "Submit";
       editRow = null;
     } else {
       // ADD
       userCount++;
       const row = document.createElement('tr');
       row.innerHTML = `
         <td>${userCount}</td>
         <td>${name}</td>
         <td>${email}</td>
         <td>${phone}</td>
         <td>${gender}</td>
         <td>
           <button class="action-btn edit" onclick="editUser(this)">Edit</button>
           <button class="action-btn delete" onclick="deleteUser(this)">Delete</button>
         </td>
       `;
       tableBody.appendChild(row);
     }
 
     userForm.reset();
   });
 
   function editUser(btn) {
     editRow = btn.closest('tr'); 
     nameField.value = editRow.children[1].innerText;
     emailField.value = editRow.children[2].innerText;
     phoneField.value = editRow.children[3].innerText;
     genderField.value = editRow.children[4].innerText;
 
     buttonSubmit.innerText = "Update";
   }
 
   function deleteUser(btn) {
     if (confirm("Are you sure you want to delete?")) {
       btn.closest('tr').remove();
     }
   }
 

 </script>
</body>
</html>
